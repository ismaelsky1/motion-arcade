<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb4f0" />
      <stop offset="100%" stop-color="#bfe6ff" />
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="100%" stop-color="#f7c948" />
    </radialGradient>
    <radialGradient id="moeda" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="100%" stop-color="#f0b429" />
    </radialGradient>
    <radialGradient id="inimigo" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c9714f" />
      <stop offset="100%" stop-color="#8a3f24" />
    </radialGradient>
  </defs>

  <rect width="460" height="215" fill="url(#ceu)" />
  <circle cx="400" cy="42" r="26" fill="url(#sol)" />

  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="70" cy="40" rx="30" ry="14" />
    <ellipse cx="95" cy="34" rx="22" ry="12" />
    <ellipse cx="45" cy="36" rx="20" ry="10" />
    <ellipse cx="230" cy="26" rx="26" ry="12" />
    <ellipse cx="255" cy="22" rx="18" ry="9" />
  </g>

  <!-- chão com um buraco à esquerda do personagem -->
  <rect x="0" y="164" width="150" height="10" fill="#4f9a3a" />
  <rect x="0" y="174" width="150" height="41" fill="#8a5a34" />
  <rect x="230" y="164" width="230" height="10" fill="#4f9a3a" />
  <rect x="230" y="174" width="230" height="41" fill="#8a5a34" />
  <ellipse cx="190" cy="169" rx="40" ry="9" fill="#1c1208" />

  <!-- moeda flutuando -->
  <circle cx="290" cy="96" r="13" fill="url(#moeda)" stroke="#c98a12" stroke-width="1.5" />
  <path d="M285 90 q6 -4 10 0" stroke="#fff8dd" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- inimigo -->
  <g>
    <circle cx="392" cy="146" r="20" fill="url(#inimigo)" />
    <rect x="378" y="160" width="10" height="10" fill="#8a3f24" />
    <rect x="398" y="160" width="10" height="10" fill="#8a3f24" />
    <circle cx="385" cy="142" r="4.5" fill="#fff" />
    <circle cx="399" cy="142" r="4.5" fill="#fff" />
    <circle cx="385" cy="142" r="2" fill="#1a1a1a" />
    <circle cx="399" cy="142" r="2" fill="#1a1a1a" />
  </g>

  <!-- personagem saltando sobre o buraco -->
  <ellipse cx="205" cy="168" rx="14" ry="5" fill="#000000" opacity="0.2" />
  <g>
    <rect x="192" y="96" width="30" height="34" rx="7" fill="#e24b4a" />
    <circle cx="207" cy="82" r="12" fill="#ffd8b0" />
    <path d="M195 82 a12 12 0 0 1 24 0 z" fill="#e24b4a" />
    <rect x="188" y="128" width="10" height="14" rx="3" fill="#c9714f" />
    <rect x="216" y="128" width="10" height="14" rx="3" fill="#c9714f" />
  </g>

  <g font-family="Inter, Arial, sans-serif" font-weight="700">
    <text x="24" y="60" font-size="46" fill="#0e1015" opacity="0.35">SALTA!</text>
    <text x="20" y="56" font-size="46" fill="#ffffff" stroke="#1a5fa8" stroke-width="2" paint-order="stroke">SALTA!</text>
  </g>
</svg>
